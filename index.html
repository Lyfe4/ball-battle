<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BallBattle: a deterministic browser auto-battler." />
    <title>BallBattle</title>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="arena-container" id="arena-container">
        <canvas id="arena" role="img" aria-label="Battle arena" tabindex="-1"></canvas>
      </div>
      <section class="hud" aria-label="Match">
        <section id="home" aria-label="Home" hidden></section>
        <section id="quick-setup" aria-label="Quick match setup" hidden></section>
        <div class="match-actions" id="match-actions"></div>
        <section id="series-setup" aria-label="Best of 3 setup" hidden></section>
        <section id="series" hidden></section>
        <div class="hud-status" id="hud-status"></div>
        <div id="hud-speed"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
