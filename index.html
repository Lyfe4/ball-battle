<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BallBattle: a deterministic browser auto-battler." />
    <title>BallBattle</title>
  </head>
  <body>
    <main class="stage">
      <div class="arena-container" id="arena-container">
        <canvas id="arena" role="img" aria-label="Battle arena"></canvas>
      </div>
      <section class="hud" aria-label="Match">
        <form id="picker" aria-label="Choose balls"></form>
        <div class="hud-status" id="hud-status"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
