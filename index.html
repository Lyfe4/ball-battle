<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BallBattle: build a lineup, watch it fight</title>
    <meta
      name="description"
      content="A strategy game about building a lineup. Build a lineup of three balls, set your order, and watch your plan fight it out. Your choices set the odds; every fight plays out its own way."
    />
    <link rel="canonical" href="https://battle-ball.netlify.app/" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="BallBattle" />

    <!-- Link previews. Crawlers read this HTML without running scripts, so every link (a shared
         match or series included) shows the same card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BallBattle" />
    <meta property="og:title" content="BallBattle: build a lineup, watch it fight" />
    <meta
      property="og:description"
      content="Build a lineup of three balls, set your order, and watch your plan fight it out. Your choices set the odds; every fight plays out its own way."
    />
    <meta property="og:url" content="https://battle-ball.netlify.app/" />
    <meta property="og:image" content="https://battle-ball.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="An Archer and a Storm mid-fight in the arena, beside the BallBattle name and its eleven balls."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BallBattle: build a lineup, watch it fight" />
    <meta
      name="twitter:description"
      content="Build a lineup of three balls, set your order, and watch your plan fight it out. Your choices set the odds; every fight plays out its own way."
    />
    <meta name="twitter:image" content="https://battle-ball.netlify.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="An Archer and a Storm mid-fight in the arena, beside the BallBattle name and its eleven balls."
    />
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="arena-container" id="arena-container">
        <canvas id="arena" role="img" aria-label="Battle arena" tabindex="-1"></canvas>
      </div>
      <section class="hud" aria-label="Match">
        <section id="home" aria-label="Home" hidden></section>
        <section id="manual" aria-label="Ball manual" hidden></section>
        <section id="outdated" aria-label="Link from another version" hidden></section>
        <section id="quick-setup" aria-label="Quick match setup" hidden></section>
        <div class="match-actions" id="match-actions"></div>
        <section id="series-setup" aria-label="Best of 3 setup" hidden></section>
        <section id="series" hidden></section>
        <div class="hud-status" id="hud-status"></div>
        <div id="hud-speed"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
