# Netlify deploys `release` to production (published by the Publish workflow), `main` as a branch
# deploy (staging) and every pull request as a preview. Build settings live here rather than in the
# dashboard.
# pnpm comes from package.json "packageManager" (Netlify uses Corepack, which needs the exact
# version pinned there).

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Security headers. Keep in step with scripts/security-headers.ts (a test checks it), which
# `vite preview` serves so the CSP can be verified against a production build locally.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# The link-preview image is fetched by other sites (chat clients, social cards), so it may be
# loaded cross-origin. Keep in step with PATH_HEADERS in scripts/security-headers.ts.
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"

# Built assets have content hashes in their names, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The game server (ADR 0052): one function per route in netlify/functions, under /api/v1/*. A
# series is played by the frozen sim of the ruleset it names (src/server/rulesets.ts), so the
# frozen bundles ship beside the functions. Their secrets are set in Netlify's dashboard, not here.
# On the Free plan the functions run in Ohio (us-east-2), far from the database in Sydney: a region
# can be chosen on Pro only (ADR 0052, the privacy policy).
[functions]
  # One self-contained file per function: pnpm's linked node_modules are not traced reliably.
  node_bundler = "esbuild"
  included_files = ["rulesets/*/sim.mjs"]

# Online play is built only where it is switched on: deploy previews and the main branch deploy
# (staging), never production until launch (ADR 0052 section 6). The functions read their own
# BALLBATTLE_ONLINE, set per context in the dashboard with their secrets.
# Production follows the vs Friend switch (ADR 0068): BALLBATTLE_ONLINE, set or unset for the
# production context in Netlify's dashboard (or `node scripts/friend-switch.ts on|off`), builds the
# client with or without online play, and the functions read the same variable. One variable, one
# redeploy, so the page and the API are never switched apart. Unset is off.
[context.production]
  command = "VITE_ONLINE=\"${BALLBATTLE_ONLINE:-}\" pnpm build"

[context.deploy-preview.environment]
  VITE_ONLINE = "1"

[context.branch-deploy.environment]
  VITE_ONLINE = "1"

# `netlify dev`: an online build (`pnpm build:online`) and the functions on one origin,
# http://localhost:8888, against a local Supabase (`pnpm exec supabase start`) and the settings in
# .env (see .env.example). It serves dist/ rather than Vite's dev server: Netlify applies the
# headers above in dev too, and the production CSP rightly blocks the dev server's inline styles.
# So online play is checked locally under the real CSP.
[dev]
  framework = "#static"
  publish = "dist"
  port = 8888
  autoLaunch = false
