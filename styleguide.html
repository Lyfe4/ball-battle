<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BallBattle style guide (dev only)</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #0f1218;
        color: #e5e7eb;
        font-family: system-ui, sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 16px;
        margin: 24px 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: #9ca3af;
        font-size: 13px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      figcaption {
        font-size: 12px;
        color: #9ca3af;
        text-align: center;
      }
      .sizes {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Ball style guide</h1>
    <p>
      Dev only (not part of the production build). Every tile is drawn by the game's own drawBall
      and ball designs, on the arena colour. Each state is shown large and at phone size (30 px
      across).
    </p>
    <div id="guide"></div>
    <script type="module" src="/src/styleguide/main.ts"></script>
  </body>
</html>
