<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      :root {
        --brawler: #e84545;
        --archer: #20c4e8;
        --frost: #a9dcf6;
        --vampire: #9150e0;
        --storm: #6ea9ea;
        --speedster: #f6c71b;
        --thorns: #2c9e3c;
        --venom: #7cc82c;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="court" style="aspect-ratio: 16/10">
        <span class="ball" style="--b: var(--vampire); left: 22%; top: 30%"></span
        ><span class="ball" style="--b: var(--storm); left: 66%; top: 52%"></span>
      </div>
      <div class="row between">
        <h1 style="font-size: 2rem">BallBattle</h1>
        <span class="gear">⚙</span>
      </div>
      <div class="btn primary big">
        Play<span class="meta">Best of 5 · Reveal · vs Hard bot</span>
      </div>
      <h2>More ways to play</h2>
      <div class="card raised row between">
        <span><b>vs Bot</b> <span class="muted small">· series</span></span
        ><span class="muted">›</span>
      </div>
      <div class="card raised row between">
        <span><b>vs Friend</b> <span class="muted small">· live link</span></span
        ><span class="muted">›</span>
      </div>
      <div class="card raised row between">
        <span><b>Free play</b> <span class="muted small">· one match</span></span
        ><span class="muted">›</span>
      </div>
      <div class="card raised row between">
        <span><b>Ball manual</b></span
        ><span class="muted">›</span>
      </div>
    </div>
  </body>
</html>
