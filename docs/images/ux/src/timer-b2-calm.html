<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      :root {
        --brawler: #e84545;
        --archer: #20c4e8;
        --frost: #a9dcf6;
        --vampire: #9150e0;
        --storm: #6ea9ea;
        --speedster: #f6c71b;
        --thorns: #2c9e3c;
        --venom: #7cc82c;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="row between">
        <span class="muted small">Best of 3 · Reveal · Round 2</span
        ><span class="row"
          ><span class="gear" style="margin: 0">⚙</span
          ><span class="gear" style="margin: 0">?</span></span
        >
      </div>
      <div class="card raised" style="gap: 8px">
        <div class="row between">
          <b style="font-size: 1.1rem">Your pick</b
          ><b style="font-size: 1.3rem; font-variant-numeric: tabular-nums" class="">22 s</b>
        </div>
        <div class="bar"><i style="width: 73%"></i></div>
        <p class="muted small">You show first; Player 4821 answers.</p>
      </div>
      <div class="track">
        <div class="row center" style="gap: 14px">
          <span class="muted">You</span><span class="score">1 – 0</span
          ><span class="muted">Player 4821</span>
        </div>
        <div class="row center" style="gap: 30px">
          <span class="ball s" style="--b: var(--archer)"></span><span class="ball s ghost"></span
          ><span class="ball s ghost"></span>
        </div>
        <div class="row center" style="gap: 30px">
          <span class="ball s" style="--b: var(--brawler)"></span><span class="ball s ghost"></span
          ><span class="ball s ghost"></span>
        </div>
      </div>
      <div class="row" style="justify-content: flex-end; gap: 10px">
        <span class="muted small">vs their</span
        ><span class="ball s" style="--b: var(--speedster)"></span
        ><span class="ball s" style="--b: var(--vampire)"></span>
      </div>
      <div class="pick-row">
        <span class="ball" style="--b: var(--storm)"></span>Storm<span class="odds"
          ><span class="odd">=</span><span class="odd up">▲</span></span
        >
      </div>
      <div class="pick-row">
        <span class="ball" style="--b: var(--frost)"></span>Frost<span class="odds"
          ><span class="odd up">▲</span><span class="odd">=</span></span
        >
      </div>
    </div>
  </body>
</html>
