<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      :root {
        --brawler: #e84545;
        --archer: #20c4e8;
        --frost: #a9dcf6;
        --vampire: #9150e0;
        --storm: #6ea9ea;
        --speedster: #f6c71b;
        --thorns: #2c9e3c;
        --venom: #7cc82c;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="header"><span class="back">‹</span><span class="gear">⚙</span></div>
      <div class="sticker" style="justify-self: center; margin: 10px 0 6px">
        <span class="small" style="font-weight: 700">A challenge from</span
        ><b style="font-size: 1.6rem">Player 6908</b>
      </div>
      <div class="row center">
        <span class="tag">Best of 3</span><span class="tag">Reveal</span
        ><span class="tag">Live · 30 s a pick</span>
      </div>
      <div class="card" style="gap: 8px">
        <b>How it goes</b>
        <span class="small">1. Build your lineup of 3 without seeing theirs.</span>
        <span class="small">2. Take turns showing a ball; the other answers.</span>
        <span class="small">3. Stay until the end: leaving for 30 s loses the match.</span>
      </div>
      <div class="btn primary">Build your lineup</div>
      <span class="link" style="justify-self: center">Not now</span>
    </div>
  </body>
</html>
