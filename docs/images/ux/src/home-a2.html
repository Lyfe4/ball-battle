<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      :root {
        --brawler: #e84545;
        --archer: #20c4e8;
        --frost: #a9dcf6;
        --vampire: #9150e0;
        --storm: #6ea9ea;
        --speedster: #f6c71b;
        --thorns: #2c9e3c;
        --venom: #7cc82c;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="court" style="aspect-ratio: 16/10">
        <span class="ball" style="--b: var(--vampire); left: 22%; top: 30%"></span
        ><span class="ball" style="--b: var(--storm); left: 66%; top: 52%"></span>
      </div>
      <div class="row between">
        <h1 style="font-size: 2rem">BallBattle</h1>
        <span class="gear">⚙</span>
      </div>
      <div class="seg"><span class="chosen">vs Bot</span><span>vs Friend</span></div>
      <div class="btn primary big">Play<span class="meta">Best of 5 · Reveal · Hard</span></div>
      <span class="link" style="justify-self: center">Change length, format or level ›</span>
      <div class="row center" style="gap: 24px; margin-top: 8px">
        <span class="link">Free play ›</span><span class="link">Ball manual ›</span>
      </div>
    </div>
  </body>
</html>
