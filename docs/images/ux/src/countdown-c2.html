<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      :root {
        --brawler: #e84545;
        --archer: #20c4e8;
        --frost: #a9dcf6;
        --vampire: #9150e0;
        --storm: #6ea9ea;
        --speedster: #f6c71b;
        --thorns: #2c9e3c;
        --venom: #7cc82c;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="court">
        <span class="ball l" style="--b: var(--archer); left: 18%; top: 58%"></span
        ><span class="ball l" style="--b: var(--brawler); left: 62%; top: 20%"></span>
        <div style="position: absolute; inset: 0; display: grid; place-items: center">
          <div
            style="
              background: var(--color-sticker);
              color: var(--color-accent-text);
              border-radius: 20px;
              padding: 14px 22px;
              display: grid;
              gap: 6px;
              justify-items: center;
              box-shadow: 0 6px 0 var(--color-accent);
            "
          >
            <div class="row" style="gap: 18px">
              <span class="ball" style="--b: var(--archer)"></span><b>vs</b
              ><span class="ball" style="--b: var(--brawler)"></span>
            </div>
            <div class="ring urgent" style="--p: 66; width: 70px; height: 70px">
              <span
                style="
                  background: var(--color-sticker);
                  width: 56px;
                  height: 56px;
                  font-size: 1.8rem;
                "
                >2</span
              >
            </div>
          </div>
        </div>
      </div>
      <div class="row between">
        <b class="small">Round 2 · You 1–0 Player 4821 ▾</b
        ><span class="gear" style="margin: 0">⚙</span>
      </div>
    </div>
  </body>
</html>
