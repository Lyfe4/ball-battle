<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      :root {
        --brawler: #e84545;
        --archer: #20c4e8;
        --frost: #a9dcf6;
        --vampire: #9150e0;
        --storm: #6ea9ea;
        --speedster: #f6c71b;
        --thorns: #2c9e3c;
        --venom: #7cc82c;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="header">
        <span class="back">‹</span>
        <h1>vs Bot</h1>
        <span class="gear">⚙</span>
      </div>
      <h2>Length</h2>
      <div class="seg"><span>Best of 3</span><span class="chosen">Best of 5</span></div>
      <p class="muted small">5 balls each · first to 3 wins</p>
      <h2>Format</h2>
      <div class="card chosen">
        <span class="name">Reveal</span
        ><span class="muted small">See both lineups. Take turns showing first.</span>
      </div>
      <div class="card">
        <span class="name">Showdown</span
        ><span class="muted small">Open together. Winners show, losers answer.</span>
      </div>
      <div class="card">
        <span class="name">Blind</span><span class="muted small">Set your order, then watch.</span>
      </div>
      <h2>Bot</h2>
      <div class="seg"><span>Easy</span><span>Normal</span><span class="chosen">Hard</span></div>
      <div class="btn primary" style="margin-top: 8px">Choose lineup</div>
    </div>
  </body>
</html>
