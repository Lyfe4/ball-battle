<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      :root {
        --brawler: #e84545;
        --archer: #20c4e8;
        --frost: #a9dcf6;
        --vampire: #9150e0;
        --storm: #6ea9ea;
        --speedster: #f6c71b;
        --thorns: #2c9e3c;
        --venom: #7cc82c;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="row between">
        <span class="muted small">Best of 3 · Reveal · Round 2</span
        ><span class="row"
          ><span class="gear" style="margin: 0">⚙</span
          ><span class="gear" style="margin: 0">?</span></span
        >
      </div>
      <div class="card raised" style="gap: 8px">
        <div class="row between">
          <b style="font-size: 1.1rem" class="dots">Player 4821 is picking</b
          ><b style="font-size: 1.3rem">18 s</b>
        </div>
        <div class="bar"><i style="width: 60%"></i></div>
        <div class="row" style="gap: 10px">
          <span class="ball s" style="--b: var(--storm)"></span
          ><span class="small">You showed <b>Storm</b>. They answer from:</span>
        </div>
        <div class="row" style="gap: 10px">
          <span class="ball" style="--b: var(--speedster); animation: none; opacity: 0.9"></span
          ><span class="ball" style="--b: var(--vampire); opacity: 0.9"></span
          ><span class="muted small">their two left</span>
        </div>
      </div>
      <div class="track">
        <div class="row center" style="gap: 14px">
          <span class="muted">You</span><span class="score">1 – 0</span
          ><span class="muted">Player 4821</span>
        </div>
        <div class="row center" style="gap: 30px">
          <span class="ball s" style="--b: var(--archer)"></span><span class="ball s ghost"></span
          ><span class="ball s ghost"></span>
        </div>
        <div class="row center" style="gap: 30px">
          <span class="ball s" style="--b: var(--brawler)"></span><span class="ball s ghost"></span
          ><span class="ball s ghost"></span>
        </div>
      </div>
      <p class="muted small" style="text-align: center">You’ll fight as soon as they pick.</p>
    </div>
  </body>
</html>
