<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      :root {
        --brawler: #e84545;
        --archer: #20c4e8;
        --frost: #a9dcf6;
        --vampire: #9150e0;
        --storm: #6ea9ea;
        --speedster: #f6c71b;
        --thorns: #2c9e3c;
        --venom: #7cc82c;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="court">
        <span class="ball l" style="--b: var(--archer); left: 18%; top: 58%"></span
        ><span class="ball l" style="--b: var(--brawler); left: 62%; top: 20%"></span>
        <div
          style="
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            gap: 0;
            align-content: center;
          "
        >
          <div class="sticker" style="padding: 14px 34px">
            <b style="font-size: 2.4rem; line-height: 1">Get ready</b
            ><span class="small" style="font-weight: 700; margin-top: 6px">Archer vs Brawler</span>
          </div>
        </div>
      </div>
      <div class="row between">
        <b class="small">Round 2 · You 1–0 Player 4821 ▾</b
        ><span class="gear" style="margin: 0">⚙</span>
      </div>
      <div class="row" style="gap: 12px">
        <div style="flex: 1">
          <span class="small">You <b style="color: var(--archer)">Archer</b></span>
          <div class="bar"><i style="width: 100%; background: var(--color-health-fill)"></i></div>
        </div>
        <div style="flex: 1">
          <span class="small">Player 4821 <b style="color: var(--brawler)">Brawler</b></span>
          <div class="bar"><i style="width: 100%; background: var(--color-health-fill)"></i></div>
        </div>
      </div>
    </div>
  </body>
</html>
