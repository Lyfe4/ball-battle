<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      :root {
        --brawler: #e84545;
        --archer: #20c4e8;
        --frost: #a9dcf6;
        --vampire: #9150e0;
        --storm: #6ea9ea;
        --speedster: #f6c71b;
        --thorns: #2c9e3c;
        --venom: #7cc82c;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="sticker" style="justify-self: center; padding: 16px 30px; margin-top: 8px">
        <b style="font-size: 2rem">You win</b
        ><span style="font-weight: 700">2 – 1 vs Player 4821</span>
      </div>
      <div class="track">
        <div class="row center" style="gap: 26px">
          <span class="ball s" style="--b: var(--archer)"></span
          ><span class="ball s" style="--b: var(--storm)"></span
          ><span class="ball s" style="--b: var(--frost)"></span>
        </div>
        <div class="row center" style="gap: 26px">
          <span class="ball s" style="--b: var(--brawler)"></span
          ><span class="ball s" style="--b: var(--speedster)"></span
          ><span class="ball s" style="--b: var(--vampire)"></span>
        </div>
        <p class="small muted" style="text-align: center">
          ✓ Fair play: every round checked on this phone
        </p>
      </div>
      <div class="btn primary">Rematch<span class="meta">Same friend, new lineups</span></div>
      <div class="row" style="gap: 8px">
        <div class="btn" style="flex: 1">Home</div>
        <div class="btn" style="flex: 1">How it was won</div>
      </div>
    </div>
  </body>
</html>
