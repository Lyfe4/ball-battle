<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      :root {
        --brawler: #e84545;
        --archer: #20c4e8;
        --frost: #a9dcf6;
        --vampire: #9150e0;
        --storm: #6ea9ea;
        --speedster: #f6c71b;
        --thorns: #2c9e3c;
        --venom: #7cc82c;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div
        class="sticker"
        style="justify-self: center; padding: 16px 30px; margin-top: 8px; transform: rotate(2deg)"
      >
        <b style="font-size: 2rem">Close one</b
        ><span style="font-weight: 700">1 – 2 vs Player 4821</span>
      </div>
      <div class="card raised" style="gap: 10px">
        <div class="row" style="gap: 10px">
          <span
            class="ball"
            style="--b: var(--color-accent-2); background: var(--color-accent-2)"
          ></span
          ><b>Player 4821 wants a rematch</b>
        </div>
        <div class="bar"><i style="width: 70%"></i></div>
        <span class="muted small">Answer within 21 s</span>
      </div>
      <div class="btn primary">Rematch</div>
      <div class="btn">No thanks</div>
    </div>
  </body>
</html>
