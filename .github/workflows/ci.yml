name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to commit SHAs (the version in the comment), so a moved tag can't change what
# runs; Dependabot (.github/dependabot.yml) proposes updates monthly.

# A pull request's new push replaces its run in progress. A push to main never cancels or replaces
# another: Publish only publishes a commit whose own CI passed, so every merge commit runs to the
# end in a group of its own (GitHub keeps only one pending run per group, so a shared group would
# drop the middle one of three quick merges even without cancel-in-progress).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Known advisories in what ships: one runtime dependency today, more once a backend adds them.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Production's own build (netlify.toml [context.production]): vs Friend on, accounts off. No
      # other build has this combination, so only here does check-bundle.ts see sign-in code that
      # escaped ACCOUNTS_BUILD before Netlify does (2026-11-23: a publish failed on it).
      - name: Build as production does (online, no accounts)
        run: pnpm build
        env:
          VITE_ONLINE: '1'
          VITE_ACCOUNTS: ''

  slow-tests:
    name: Slow roster tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Every matchup for whole matches: determinism, the measured pass-through margin and the
      # identity rules. Kept out of the main job so pnpm test stays fast.
      - run: pnpm test:slow

  balance:
    name: Balance check (150 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Every matchup on 150 seeds per slot order, without the sensitivity runs: fails only on a
      # clear miss of a balance target or a counter-map band (ADR 0011). The seeds are fixed, so
      # it can't flake. A full `pnpm balance` (500 seeds) still judges borderline pairs.
      - run: pnpm balance:ci

  database:
    name: API against a local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Postgres, Auth, Realtime, the gateway and the pooler (Supavisor) in Docker, with
      # supabase/migrations and supabase/seed.sql applied (ADR 0052, "Tests and CI"). The API
      # connects through the pooler, as on Netlify. Realtime makes `realtime.send`, which the
      # poke's triggers call (ADR 0082). The services the game doesn't use are left out.
      - run: >-
          pnpm exec supabase start
          -x studio,postgres-meta,imgproxy,logflare,vector,edge-runtime,storage-api
      # The route handlers called with Request objects, against the real database: the schema's
      # access rules, sessions, the series machine and challenges.
      - run: pnpm test:db

  # The online flows in three shards at once, each with its own local Supabase and `netlify dev`
  # (the files of one shard still run one at a time, as before). The suite took ~24 min of tests
  # in one job, the whole critical path of every run (2026-11-26). Which file runs where is
  # src/flows/online-shards.ts, spread by measured time; its test fails on a file in no shard.
  online-shard:
    name: A friend challenge in Chromium (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      # Every shard reports, so one failure shows whether the others pass too.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # A shard is about 8 min of tests plus 2 of setup: room to grow before a run is cut off.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The local stack takes about 45 s to start (most of it pulling images), about as long as the
      # three steps after it together, which don't need it (the online build reads no .env). So it
      # starts in the background and "Wait for Supabase" joins it: about 45 s off this job, the
      # critical path of every run. Its log is printed either way.
      - name: Start Supabase in the background
        run: |
          (
            pnpm exec supabase start \
              -x studio,postgres-meta,imgproxy,logflare,vector,edge-runtime,storage-api
            echo "$?" > supabase-start.exit
          ) > supabase-start.log 2>&1 &
      # The browser only, no apt: the runner image already has Chromium's system libraries (it
      # ships Chrome), and apt from the Ubuntu mirror can stall for minutes (ADR 0065).
      - run: pnpm exec playwright install chromium
      # An online build served by `netlify dev` with the functions on one origin, as on a deploy
      # preview.
      - run: pnpm build:online
      # Its own step: the install alone takes about two minutes.
      - run: npm install --global netlify-cli@27.14.0
      - name: Wait for Supabase
        run: |
          for attempt in $(seq 1 150); do
            [ -f supabase-start.exit ] && break
            sleep 2
          done
          cat supabase-start.log
          [ "$(cat supabase-start.exit 2>/dev/null)" = 0 ]
      # The functions' settings from the local stack (scripts/local-env.ts).
      - run: node scripts/local-env.ts > .env
      - name: Start netlify dev
        run: |
          netlify dev --offline > netlify-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8888/api/v1/health && exit 0
            sleep 2
          done
          cat netlify-dev.log
          exit 1
      # Two browser contexts (two guests) send, accept and play a challenge to its end: this
      # shard's files of the online project.
      - name: Run shard ${{ matrix.shard }} of the online flows
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          files=$(node --input-type=module -e "
            const { shardFiles } = await import('./src/flows/online-shards.ts');
            console.log(shardFiles(Number(process.env.SHARD)).join(' '));
          ")
          echo "Shard $SHARD: $files"
          pnpm exec vitest run --project online $files

  # The required check (the ruleset "main: CI must pass" names this job): it passes only when every
  # shard passed. A shard that failed, was cancelled or was skipped fails it, and it runs even then
  # (`always()`), so the required name always reports.
  online-flow:
    name: A friend challenge in Chromium
    needs: online-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.online-shard.result }}
        run: |
          echo "The online shards: $RESULT"
          [ "$RESULT" = success ]

  browsers:
    name: Browsers in ${{ matrix.name }} (${{ matrix.part }})
    # Two jobs per engine, in parallel: each engine's browser projects took 7-8 minutes in one job,
    # the whole critical path of a pull request. The phone projects (touch, Safari) are one part
    # and every other browser project the other; they take about the same time. "Everything else"
    # is written as an exclusion, so a new browser project always runs somewhere.
    strategy:
      # Every job reports, so a failure in one shows whether the others pass too.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        part: [phones, rest]
        include:
          - browser: chromium
            name: Chromium
          - browser: firefox
            name: Firefox
          - browser: webkit
            name: WebKit
    runs-on: ubuntu-24.04
    # Playwright's own image, with this Playwright's browsers and every system library they need
    # already installed (ADR 0065): no apt at all. Installing WebKit's libraries from the Ubuntu
    # mirror took 15-65 s on a good run and 6-15 minutes on a slow one, which ran jobs out of time
    # before any test (2026-11-18, four times). The tag must be the Playwright in pnpm-lock.yaml
    # (scripts/ci-image.test.ts); the digest pins it, as the actions are pinned. User 1001 is the
    # runner's own, as in Playwright's docs for GitHub Actions, so the checkout and caches keep
    # their owner.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --user 1001
    # The reload flows (ADR 0042) play three whole series per size and engine.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same golden test the unit suite runs in Node, in V8, SpiderMonkey and JavaScriptCore:
      # every recorded match must end the same way, on the same tick, with the same hash (ADR 0023),
      # and the flows through the real page. Vitest names each engine's copy of a browser project
      # "<project> (<engine>)": the part picks projects, the browser filter keeps this engine only.
      - name: Run the ${{ matrix.part }} part
        env:
          ENGINE: ${{ matrix.browser }}
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = phones ]; then
            pnpm exec vitest run --project "browsers-touch ($ENGINE)" --project "browsers-safari ($ENGINE)"
          else
            pnpm exec vitest run --project "browsers* ($ENGINE)"               --project "!browsers-touch ($ENGINE)" --project "!browsers-safari ($ENGINE)"
          fi

      # The font downloads once on a first visit to every page (ADR 0087), in this engine, as
      # production serves the build: WebKit included, which the dev server can't show
      # (scripts/font-once.ts). Once per engine, with the rest.
      - name: The font once, as production serves it
        if: matrix.part == 'rest'
        env:
          ENGINE: ${{ matrix.browser }}
        run: |
          pnpm exec vite build
          node scripts/font-once.ts "$ENGINE"
