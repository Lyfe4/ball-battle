name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to commit SHAs (the version in the comment), so a moved tag can't change what
# runs; Dependabot (.github/dependabot.yml) proposes updates monthly.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  slow-tests:
    name: Slow roster tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Every matchup for whole matches: determinism, the measured pass-through margin and the
      # identity rules. Kept out of the main job so pnpm test stays fast.
      - run: pnpm test:slow

  balance:
    name: Balance check (150 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Every matchup on 150 seeds per slot order, without the sensitivity runs: fails only on a
      # clear miss of a balance target or a counter-map band (ADR 0011). The seeds are fixed, so
      # it can't flake. A full `pnpm balance` (500 seeds) still judges borderline pairs.
      - run: pnpm balance:ci

  browsers:
    name: Browsers in ${{ matrix.name }} (${{ matrix.part }})
    # Two jobs per engine, in parallel: each engine's browser projects took 7-8 minutes in one job,
    # the whole critical path of a pull request. The phone projects (touch, Safari) are one part
    # and every other browser project the other; they take about the same time. "Everything else"
    # is written as an exclusion, so a new browser project always runs somewhere.
    strategy:
      # Every job reports, so a failure in one shows whether the others pass too.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        part: [phones, rest]
        include:
          - browser: chromium
            name: Chromium
          - browser: firefox
            name: Firefox
          - browser: webkit
            name: WebKit
    # Pinned: Playwright's browser builds follow the OS, and ubuntu-latest moving to 26.04 left the
    # cached WebKit (built for 24.04) without its ICU library. Move it deliberately, not by default.
    runs-on: ubuntu-24.04
    # The reload flows (ADR 0042) play three whole series per size and engine.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each Playwright release pins its own browser builds, so the cache is keyed on its version.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache the browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the image too, so a new OS never reuses browsers built for another.
          key: playwright-${{ env.ImageOS }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      - name: Install the browsers and their system libraries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # The browsers come from the cache; the system libraries they need are not cached.
      - name: Install the browsers' system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      # The same golden test the unit suite runs in Node, in V8, SpiderMonkey and JavaScriptCore:
      # every recorded match must end the same way, on the same tick, with the same hash (ADR 0023),
      # and the flows through the real page. Vitest names each engine's copy of a browser project
      # "<project> (<engine>)": the part picks projects, the browser filter keeps this engine only.
      - name: Run the ${{ matrix.part }} part
        env:
          ENGINE: ${{ matrix.browser }}
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = phones ]; then
            pnpm exec vitest run --project "browsers-touch ($ENGINE)" --project "browsers-safari ($ENGINE)"
          else
            pnpm exec vitest run --project "browsers* ($ENGINE)"               --project "!browsers-touch ($ENGINE)" --project "!browsers-safari ($ENGINE)"
          fi
