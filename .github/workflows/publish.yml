name: Publish

# Production is the `release` branch, not `main` (ADR 0052, "Cost"). Netlify's Free plan charges 15
# of its 300 monthly credits for every production deploy, so merges to `main` collect into batches
# and this workflow publishes one: it fast-forwards `release` to a `main` commit whose CI passed,
# and Netlify deploys `release`. Deploy previews on pull requests are unchanged.
#
# Before `release` moves, it applies that commit's supabase/migrations to the production database
# and checks production then holds exactly those (ADR 0068). If it can't, nothing is published:
# the new code never goes live on a database without its migrations. Migrations are expand only, so
# the deploy still live keeps working on the migrated schema while Netlify builds the new one.
#
# Run it from the Actions tab or with `gh workflow run publish.yml` (optionally `-f ref=<sha>`).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'The main commit to publish (default: the tip of main)'
        required: false
        default: main

permissions:
  contents: write
  actions: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Fast-forward release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SUPABASE_ACCESS_TOKEN lives here, usable from main only.
    environment: supabase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the commit
        id: commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse --verify "origin/${REF}^{commit}" 2>/dev/null || git rev-parse --verify "${REF}^{commit}")
          # Only what is on main is published: never a branch that skipped review.
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Every CI job on main ran on this commit and passed. A commit still being checked or never
      # checked (pushed with [skip ci]) is refused rather than waited for.
      - name: Check CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != success ]; then
            echo "::error::CI on $SHA is '${conclusion:-not run}', not success"
            exit 1
          fi

      # The published commit's migrations, applied with main's scripts (an older commit may predate
      # them).
      - name: Take the commit's migrations
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          rm -rf supabase/migrations
          git checkout "$SHA" -- supabase/migrations

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrate production, or refuse to publish
        run: node scripts/migrate.ts production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Fast-forward only: `release` never holds a commit that isn't on main, and a publish never
      # moves it backwards (an older ref fails here; roll back in Netlify's dashboard instead).
      - name: Fast-forward release
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git merge-base --is-ancestor origin/release "$SHA" || { echo "::error::release is not behind $SHA"; exit 1; }
          if [ "$(git rev-parse origin/release)" = "$SHA" ]; then
            echo "release is already at $SHA: nothing to publish"
            exit 0
          fi
          git push origin "$SHA:refs/heads/release"
          {
            echo "Published \`$SHA\` to \`release\`; Netlify deploys it to production."
            echo
            echo "Merges in this batch:"
            git log --merges --format='- %s' "origin/release..$SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      # The live site came up on the new code (2026-11-28 audit): the workflow was green as soon as
      # `release` moved, even if the deploy then failed or the API answered 500. Gives Netlify's
      # build three minutes (a production build takes one to two; one with nothing to build is
      # skipped), then waits up to 10 minutes for /health to answer (200, or 404 `online_off` where vs Friend is off) with the
      # status ok, and for the home page to serve a script; read-only. A red run here means: open
      # Netlify > Deploys, and roll back there (docs/launch-day-runbook.md).
      - name: Check the live site
        run: |
          sleep 180
          for attempt in $(seq 1 40); do
            sleep 15
            code=$(curl -s -o health.json -w '%{http_code}' https://battle-ball.netlify.app/api/v1/health || true)
            page=$(curl -s -o /dev/null -w '%{http_code}' https://battle-ball.netlify.app/ || true)
            if [ "$page" = 200 ] && { { [ "$code" = 200 ] && grep -q '"status":"ok"' health.json; } || { [ "$code" = 404 ] && grep -q 'online_off' health.json; }; }; then
              echo "Live: home 200, health $code ($(cat health.json))" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for the live site (home $page, health $code)"
          done
          echo "::error::The live site did not come up healthy within 10 minutes: roll back in Netlify > Deploys"
          exit 1
